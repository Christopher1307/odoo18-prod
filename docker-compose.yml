services:
  web:
    build: .
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    ports:
      - "8069:8069"
    volumes:
      - ./config:/etc/odoo
      - odoo-web-data:/var/lib/odoo
    command:
      - odoo
      - -c
      - /etc/odoo/odoo.conf

      - --db_host=db
      - --db_user=odoo
      - --db_password=odoo
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/server-tools,/mnt/extra-addons/web-18.0,/mnt/extra-addons/dms,/mnt/extra-addons/custom
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

volumes:
  odoo-web-data:
    external: true
    name: filestore
  odoo-db-data:
    external: true
    name: "339c32e8eb4bf5f86bb159a8271110a9c98cfc3f687860097ad7f1d393097e10"
